name: agent-ops

services:
  manager:
    build: ../manager
    restart: unless-stopped

  config:
    build:
      context: ..
      dockerfile: config/Dockerfile
    restart: unless-stopped
    depends_on:
      # Startup runs create_all, so the database must be ready first.
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network the DB host is the service name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agentops}
      # The seed key is hashed before it is ever stored.
      SEED_AGENT_KEY: ${SEED_AGENT_KEY:?set SEED_AGENT_KEY in .env}

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agentops}

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Localhost only: host-run tests reach the database; nothing outside the machine can.
      - "127.0.0.1:5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates agentops_test on first init so the suite never touches the real db.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serves the config UI's static assets; the edge nginx below is the only
  # container with a published port.
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ../web:/usr/share/nginx/html:ro

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
