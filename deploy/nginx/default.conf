server {
    listen 80;

    # SSE: no proxy buffering, and a read timeout above the manager's
    # periodic state push so an idle stream never gets cut here.
    location /v1/ {
        proxy_pass http://manager:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
