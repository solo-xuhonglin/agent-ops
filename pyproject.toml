[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["docs", "contract", ".venv"]

[tool.ruff.lint.flake8-bugbear]
# Depends in defaults is the FastAPI idiom.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["config/tests", "shared/tests", "worker/tests", "manager/tests"]
pythonpath = ["config/src", "shared/src", "worker/src", "manager/src"]
