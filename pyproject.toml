[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["docs", "contract", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["config/tests", "shared/tests", "worker/tests"]
pythonpath = ["config/src", "shared/src", "worker/src"]
